---
layout: default
---
<article class="post-container">
    <div class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        
        <div class="tags">
            {% for genre in page.genre %}
            <span class="genre-tag">{{ genre }}</span>
            {% endfor %}
        </div>
        
        <p class="author" style="margin-top: 15px; color: #555;">
            Written by <strong>{{ page.author }}</strong> on {{ page.date | date: "%-d %B %Y" }}
        </p>
    </div>

    {% if page.image %}
    <div class="post-cover">
        <img src="{{ page.image | relative_url }}" alt="{{ page.title }} cover image" style="width: 100%; max-height: 500px; object-fit: cover; border-radius: 8px; margin-bottom: 20px;">
    </div>
    {% endif %}

    <div class="post-content">
        {{ content }}
    </div>

    <div style="clear: both;"></div>
    <hr>
</article>
